                      distance: *id010
                      pathCache: !!uk.ac.ox.poseidon.geography.paths.DefaultPathCacheFactory
                        bathymetricGrid: *id003
                        distance: *id010
                        portGrid: *id006
                      portGrid: *id006
                    randomNumberGenerator: !!uk.ac.ox.poseidon.core.RandomNumberGeneratorFactory {
                      }
                    searchCentre: !!uk.ac.ox.poseidon.agents.choices.BestKnownOptionFactory
