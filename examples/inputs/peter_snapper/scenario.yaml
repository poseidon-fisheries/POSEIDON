    bathymetricGrid: *id003
    distanceCalculator: &id010 !!uk.ac.ox.poseidon.geography.distance.HaversineDistanceCalculatorFactory
      modelGrid: *id002
    ports: !!uk.ac.ox.poseidon.core.utils.ListFactory
      factories:
      - !!uk.ac.ox.poseidon.core.utils.PairFactory
        first: &id017 !!uk.ac.ox.poseidon.geography.ports.PortFactory {
          code: P1,
          name: Benoa
        }
        second: !!uk.ac.ox.poseidon.geography.CoordinateFactory {
          latitude: -8.799605,
          longitude: 115.238843
        }
      - !!uk.ac.ox.poseidon.core.utils.PairFactory
        first: &id025 !!uk.ac.ox.poseidon.geography.ports.PortFactory {
          code: P2,
          name: Kupang
        }
        second: !!uk.ac.ox.poseidon.geography.CoordinateFactory {
          latitude: -10.148044,
          longitude: 123.586249
        }
