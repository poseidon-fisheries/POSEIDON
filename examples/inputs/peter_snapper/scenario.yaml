!!uk.ac.ox.poseidon.core.Scenario
components:
  modelGrid: &id002 !!uk.ac.ox.poseidon.geography.grids.ModelGridFromLonLatTableFactory
    gridWidthInCells: 70
    lonLatTable: &id001 !!uk.ac.ox.poseidon.geography.utils.ElevationTableFactory
      elevationColumnName: elevation
      latitudeColumnName: lat
      longitudeColumnName: lon
      table: !!uk.ac.ox.poseidon.io.tables.TableFromCsvFactory
        dataSource: !!uk.ac.ox.poseidon.io.sources.ZipEntryDataSourceFactory
          encoding: UTF-8
          entry: elevations.csv
          path: !!uk.ac.ox.poseidon.io.paths.RelativePathFactory
            parent: !!uk.ac.ox.poseidon.io.paths.RootPathFactory {
              path: inputs/peter_snapper
            }
            path: elevations.zip
    mapPaddingInDegrees: 1.0E-6
  bathymetricGrid: &id003 !!uk.ac.ox.poseidon.geography.bathymetry.BathymetricGridFromElevationTableFactory
    aggregator: !!uk.ac.ox.poseidon.core.aggregators.MeanAggregatorFactory {
      }
    elevationTable: *id001
    inverted: false
    modelGrid: *id002
  carryingCapacityGrid: &id004 !!uk.ac.ox.poseidon.biology.biomass.CarryingCapacityGridFactory
    grid: !!uk.ac.ox.poseidon.geography.grids.NormalisedDoubleGridFromAllocatorFactory
      allocator: !!uk.ac.ox.poseidon.geography.allocators.FilteredAllocatorFactory
        cellPredicate: !!uk.ac.ox.poseidon.core.predicates.logical.AllOfFactory
          predicates:
          - !!uk.ac.ox.poseidon.geography.predicates.IsActiveWaterCellFactory
            bathymetricGrid: *id003
          - !!uk.ac.ox.poseidon.core.predicates.ConditionFactory
            predicate: !!uk.ac.ox.poseidon.core.predicates.comparable.BetweenFactory
              includeMaximum: true
              includeMinimum: true
              maximum: !!uk.ac.ox.poseidon.core.providers.constant.ConstantFactory
                object: !!uk.ac.ox.poseidon.core.utils.ObjectFactory {
                  value: -30.0
                }
              minimum: !!uk.ac.ox.poseidon.core.providers.constant.ConstantFactory
                object: !!uk.ac.ox.poseidon.core.utils.ObjectFactory {
                  value: -800.0
                }
            subject: !!uk.ac.ox.poseidon.geography.grids.extractors.CellValueFactory
              grid: *id003
        delegateAllocator: !!uk.ac.ox.poseidon.geography.allocators.SupplierAllocatorFactory
          value: !!uk.ac.ox.poseidon.core.providers.constant.ConstantFactory
            object: !!uk.ac.ox.poseidon.core.utils.ObjectFactory {
              value: 1.0
            }
      modelGrid: *id002
      totalValue: !!uk.ac.ox.poseidon.core.quantities.KilogramsFactory
        mass: !!uk.ac.ox.poseidon.core.quantities.MassFactory {
          unitString: kg,
          value: 1.10749315E8
        }
  biomassGrid: &id005 !!uk.ac.ox.poseidon.biology.biomass.BiomassGridFactory
    biomassAllocator: !!uk.ac.ox.poseidon.biology.allocators.ProportionOfCarryingCapacityAllocatorFactory
      carryingCapacityGrid: *id004
      proportion: !!uk.ac.ox.poseidon.core.providers.random.RandomDoubleFactory
        maximum: 0.8
        minimum: 0.7
        randomNumberGenerator: !!uk.ac.ox.poseidon.core.RandomNumberGeneratorFactory {
          }
    modelGrid: *id002
    species: &id008 !!uk.ac.ox.poseidon.biology.species.SpeciesFactory {
      code: PS,
      lifeStage: null,
      name: Peter Snapper
    }
  biomassDiffuser: !!uk.ac.ox.poseidon.core.schedule.ScheduledRepeatingFactory
    interval: !!uk.ac.ox.poseidon.core.time.PeriodFactory {
      days: 1,
      months: 0,
      years: 0
    }
    ordering: 0
    startingDateTime: !!uk.ac.ox.poseidon.core.time.DateTimeAfterStartingFactory
      amountToAdd: !!uk.ac.ox.poseidon.core.time.DurationFactory {
        days: 1,
        hours: 0,
        minutes: 0,
        seconds: 0
      }
      startingDateTime: !!uk.ac.ox.poseidon.core.StartingDateTimeFactory {
        }
    steppable: !!uk.ac.ox.poseidon.biology.biomass.BiomassDiffuserFactory
      biomassDiffusionRule: !!uk.ac.ox.poseidon.biology.biomass.SmoothBiomassDiffusionRuleFactory {
        differentialPercentageToMove: 0.001,
        percentageLimitOnDailyMovement: 0.01
      }
      biomassGrid: *id005
      carryingCapacityGrid: *id004
      randomNumberGenerator: !!uk.ac.ox.poseidon.core.RandomNumberGeneratorFactory {
        }
  biomassGrower: !!uk.ac.ox.poseidon.core.schedule.ScheduledRepeatingFactory
    interval: !!uk.ac.ox.poseidon.core.time.PeriodFactory {
      days: 0,
      months: 0,
      years: 1
    }
    ordering: 0
    startingDateTime: !!uk.ac.ox.poseidon.core.time.DateTimeAfterStartingFactory
      amountToAdd: !!uk.ac.ox.poseidon.core.time.PeriodFactory {
        days: 0,
        months: 0,
        years: 1
      }
      startingDateTime: !!uk.ac.ox.poseidon.core.StartingDateTimeFactory {
        }
    steppable: !!uk.ac.ox.poseidon.biology.biomass.CommonBiomassGrowerFactory
      biomassGrid: *id005
      biomassGrowthRule: !!uk.ac.ox.poseidon.biology.biomass.LogisticGrowthRuleFactory {
        growthRate: 0.372
      }
      biomassRecruitmentAllocator: !!uk.ac.ox.poseidon.biology.biomass.RandomBiomassRecruitmentAllocatorFactory
        randomNumberGenerator: !!uk.ac.ox.poseidon.core.RandomNumberGeneratorFactory {
          }
      carryingCapacityGrid: *id004
  portGrid: &id006 !!uk.ac.ox.poseidon.geography.ports.PortGridFactory
    bathymetricGrid: *id003
    distanceCalculator: &id010 !!uk.ac.ox.poseidon.geography.distance.HaversineDistanceCalculatorFactory
      modelGrid: *id002
    ports: !!uk.ac.ox.poseidon.core.utils.ListFactory
      factories:
      - !!uk.ac.ox.poseidon.core.utils.PairFactory
        first: &id020 !!uk.ac.ox.poseidon.geography.ports.PortFactory {
          code: P1,
          name: Benoa
        }
        second: !!uk.ac.ox.poseidon.geography.CoordinateFactory {
          latitude: -8.799605,
          longitude: 115.238843
        }
      - !!uk.ac.ox.poseidon.core.utils.PairFactory
        first: &id026 !!uk.ac.ox.poseidon.geography.ports.PortFactory {
          code: P2,
          name: Kupang
        }
        second: !!uk.ac.ox.poseidon.geography.CoordinateFactory {
          latitude: -10.148044,
          longitude: 123.586249
        }
  marketGrid: &id007 !!uk.ac.ox.poseidon.agents.market.MarketGridFactory
    markets: !!uk.ac.ox.poseidon.agents.market.OneBiomassMarketPerPortFactory
      eventManager: !!uk.ac.ox.poseidon.core.EventManagerFactory {
        }
      portGrid: *id006
    portGrid: *id006
  initialPrices: !!uk.ac.ox.poseidon.agents.market.InitialPricesFactory
    currentDateTime: !!uk.ac.ox.poseidon.core.CurrentDateTimeFactory {
      }
    marketPrices:
    - !!uk.ac.ox.poseidon.agents.market.UniformMarketPricesFactory
      marketGrid: *id007
      priceEntries: !!uk.ac.ox.poseidon.core.utils.ListFactory
        factories:
        - !!uk.ac.ox.poseidon.agents.market.PriceEntryFactory
          catchCategory: &id017 !!uk.ac.ox.poseidon.agents.catches.UncategorisedCatchCategoryFactory {
            }
          price: !!uk.ac.ox.poseidon.agents.market.PriceFactory {
            amount: 40000.0,
            currencyUnit: IDR,
            massUnit: kg
          }
          species: *id008
  gearProportion: &id016 !!uk.ac.ox.poseidon.core.utils.ObjectFactory {
    value: 6.41964E-4
  }
  vesselField: &id021 !!uk.ac.ox.poseidon.agents.fields.VesselFieldFactory
    modelGrid: *id002
  agentCreators: !!uk.ac.ox.poseidon.core.schedule.ScheduledOnceAtStartFactory
    ordering: 0
    steppable: !!uk.ac.ox.poseidon.core.schedule.SteppableSequenceFactory
      steppables: !!uk.ac.ox.poseidon.core.utils.ListFactory
        factories:
        - !!uk.ac.ox.poseidon.agents.vessels.VesselCreatorFactory
          account: &id022 !!uk.ac.ox.poseidon.agents.vessels.accounts.AccountFactory {
            }
          behaviour: &id023
            factory: !!uk.ac.ox.poseidon.agents.tasks.BehaviourFactory
              rootTask: !!uk.ac.ox.poseidon.agents.tasks.branches.SequenceTaskFactory
                children:
                - !!uk.ac.ox.poseidon.agents.tasks.destinations.StartTripFactory
                  destination: !!uk.ac.ox.poseidon.agents.choices.EpsilonGreedyDestinationFactory
                    epsilon: 0.2
                    exploiter: !!uk.ac.ox.poseidon.agents.choices.ImitatingPickerFactory
                      imitatedOptionValues: !!uk.ac.ox.poseidon.agents.choices.BestOptionsFromFriendsFactory
                        friends: !!uk.ac.ox.poseidon.agents.vessels.friends.DynamicFriendsFactory
                          friendshipCondition: !!uk.ac.ox.poseidon.core.predicates.logical.AllOfFactory
                            predicates:
                            - !!uk.ac.ox.poseidon.agents.vessels.values.OtherFactory
                              value: !!uk.ac.ox.poseidon.agents.vessels.values.VesselIsActiveFactory {
                                }
                            - !!uk.ac.ox.poseidon.core.predicates.ConditionFactory
                              predicate: !!uk.ac.ox.poseidon.core.predicates.EqualFactory
                                value: !!uk.ac.ox.poseidon.agents.vessels.values.VesselPropertyFactory {
                                  propertyPath: homePort
                                }
                              subject: !!uk.ac.ox.poseidon.agents.vessels.values.OtherFactory
                                value: !!uk.ac.ox.poseidon.agents.vessels.values.VesselPropertyFactory {
                                  propertyPath: homePort
                                }
                          potentialFriends: &id009 !!uk.ac.ox.poseidon.agents.components.VesselComponentRegisterFactory {
                            }
                          randomNumberGenerator: !!uk.ac.ox.poseidon.core.RandomNumberGeneratorFactory {
                            }
                          targetNumberOfFriends: 2
                        optionValuesRegister: *id009
                      optionPredicate: !!uk.ac.ox.poseidon.core.providers.constant.ConstantMappingFactory
                        result: !!uk.ac.ox.poseidon.core.utils.ObjectFactory {
                          value: true
                        }
                      optionValues: &id013 !!uk.ac.ox.poseidon.agents.components.RegisteredVesselComponentFactory
                        componentFactory: !!uk.ac.ox.poseidon.agents.choices.ExponentialMovingAverageOptionValuesFactory {
                          alpha: 1.0
                        }
                        componentRegister: *id009
                      randomNumberGenerator: !!uk.ac.ox.poseidon.core.RandomNumberGeneratorFactory {
                        }
                    explorer: !!uk.ac.ox.poseidon.agents.choices.NeighbourhoodGridExplorerFactory
                      cellPredicate: &id011 !!uk.ac.ox.poseidon.core.predicates.ConditionFactory
                        predicate: !!uk.ac.ox.poseidon.core.predicates.comparable.GreaterThanFactory
                          value: !!uk.ac.ox.poseidon.core.providers.constant.ConstantFactory
                            object: !!uk.ac.ox.poseidon.core.utils.ObjectFactory {
                              value: 0.0
                            }
                        subject: !!uk.ac.ox.poseidon.geography.grids.extractors.CellValueFactory
                          grid: *id004
                      maximumWidening: 3
                      neighbourhoodSize: !!uk.ac.ox.poseidon.agents.vessels.OneValueFromFactory
                        delegate: !!uk.ac.ox.poseidon.core.providers.random.RandomIntFactory
                          maximum: 10
                          minimum: 1
                          randomNumberGenerator: !!uk.ac.ox.poseidon.core.RandomNumberGeneratorFactory {
                            }
                      pathFinder: &id012 !!uk.ac.ox.poseidon.geography.paths.DefaultPathFinderFactory
                        accessibleWaterCellsCache: !!uk.ac.ox.poseidon.geography.paths.AccessibleWaterCellsCacheFactory
                          bathymetricGrid: *id003
                          portGrid: *id006
                        bathymetricGrid: *id003
                        distance: *id010
                        pathCache: !!uk.ac.ox.poseidon.geography.paths.DefaultPathCacheFactory
                          bathymetricGrid: *id003
                          distance: *id010
                          portGrid: *id006
                        portGrid: *id006
                      randomNumberGenerator: !!uk.ac.ox.poseidon.core.RandomNumberGeneratorFactory {
                        }
                      searchCentre: !!uk.ac.ox.poseidon.agents.choices.BestKnownOptionFactory
                        fallback: !!uk.ac.ox.poseidon.agents.choices.RandomGridExplorerFactory
                          cellPredicate: *id011
                          cells: !!uk.ac.ox.poseidon.agents.vessels.values.AccessibleWaterCellsFactory
                            pathFinder: *id012
                          randomNumberGenerator: !!uk.ac.ox.poseidon.core.RandomNumberGeneratorFactory {
                            }
                        optionValues: *id013
                        randomNumberGenerator: !!uk.ac.ox.poseidon.core.RandomNumberGeneratorFactory {
                          }
                    randomNumberGenerator: !!uk.ac.ox.poseidon.core.RandomNumberGeneratorFactory {
                      }
                - !!uk.ac.ox.poseidon.agents.tasks.travel.TravelAlongPathFactory
                  destination: !!uk.ac.ox.poseidon.agents.vessels.values.CurrentTripDestinationCellFactory {
                    }
                  distance: *id010
                  engine: &id015
                    factory: !!uk.ac.ox.poseidon.agents.vessels.engines.SimpleEngineFactory
                      cruisingSpeed: !!uk.ac.ox.poseidon.core.quantities.SpeedFactory {
                        unitString: km/h,
                        value: 16.0
                      }
                      fuelConsumedPerKm: !!uk.ac.ox.poseidon.core.quantities.VolumeFactory {
                        unitString: l,
                        value: 3.0
                      }
                      fuelTank: !!uk.ac.ox.poseidon.agents.vessels.engines.SimpleFuelTankFactory
                        capacity: &id014 !!uk.ac.ox.poseidon.core.quantities.VolumeFactory {
                          unitString: l,
                          value: 100000.0
                        }
                        currentFuel: *id014
                  eventManager: !!uk.ac.ox.poseidon.agents.vessels.values.CurrentTripEventManagerFactory {
                    }
                  pathFinder: *id012
                - !!uk.ac.ox.poseidon.agents.tasks.decorators.UntilFailTaskFactory
                  child: !!uk.ac.ox.poseidon.agents.tasks.branches.SequenceTaskFactory
                    children:
                    - !!uk.ac.ox.poseidon.agents.tasks.fishing.FishingFactory
                      dispositionProcess: !!uk.ac.ox.poseidon.agents.catches.disposition.ProportionallyLimitingBiomassToHoldFactory {
                        }
                      engine: *id015
                      fisheable: !!uk.ac.ox.poseidon.agents.fisheables.CurrentCellFisheableFactory
                        fisheableGrid: *id005
                      gear: &id019
                        factory: !!uk.ac.ox.poseidon.agents.vessels.gears.FixedBiomassProportionGearFactory
                          code: FGL
                          duration: !!uk.ac.ox.poseidon.core.providers.constant.ConstantFactory
                            object: !!uk.ac.ox.poseidon.core.time.DurationFactory {
                              days: 0,
                              hours: 1,
                              minutes: 0,
                              seconds: 0
                            }
                          fuelConsumptionRate: !!uk.ac.ox.poseidon.core.quantities.VolumetricFlowRateFactory {
                            unitString: l/h,
                            value: 70.0
                          }
                          minimumCatchThreshold: !!uk.ac.ox.poseidon.core.quantities.MassFactory {
                            unitString: kg,
                            value: 1.0
                          }
                          proportion: *id016
                      hold: &id018
                        factory: !!uk.ac.ox.poseidon.agents.vessels.holds.StandardBiomassHoldFactory
                          capacity: !!uk.ac.ox.poseidon.core.quantities.MassFactory {
                            unitString: kg,
                            value: 15000.0
                          }
                          catchCategoriser: !!uk.ac.ox.poseidon.agents.catches.UniformCatchCategoriserFactory
                            catchCategory: *id017
                          tolerance: !!uk.ac.ox.poseidon.core.quantities.MassFactory {
                            unitString: kg,
                            value: 1.0
                          }
                    - !!uk.ac.ox.poseidon.agents.tasks.general.VesselPredicateTaskFactory
                      predicate: !!uk.ac.ox.poseidon.core.functions.MappingAsValueFactory
                        mapping: !!uk.ac.ox.poseidon.core.predicates.logical.AllOfFactory
                          predicates:
                          - !!uk.ac.ox.poseidon.core.functions.ValueAsMappingFactory
                            value: !!uk.ac.ox.poseidon.core.functions.MappingAsValueFactory
                              mapping: !!uk.ac.ox.poseidon.core.predicates.ConditionFactory
                                predicate: !!uk.ac.ox.poseidon.core.predicates.comparable.GreaterThanFactory
                                  value: !!uk.ac.ox.poseidon.core.providers.constant.ConstantFactory
                                    object: !!uk.ac.ox.poseidon.core.utils.ObjectFactory {
                                      value: 1.0
                                    }
                                subject: !!uk.ac.ox.poseidon.core.functions.ValueAsMappingFactory
                                  value: !!uk.ac.ox.poseidon.agents.vessels.values.ComponentPropertyFactory
                                    component: *id018
                                    propertyPath: availableCapacityInKg
                          - !!uk.ac.ox.poseidon.core.functions.ValueAsMappingFactory
                            value: !!uk.ac.ox.poseidon.core.functions.MappingAsValueFactory
                              mapping: !!uk.ac.ox.poseidon.core.predicates.ConditionFactory
                                predicate: !!uk.ac.ox.poseidon.core.predicates.comparable.LessThanFactory
                                  value: !!uk.ac.ox.poseidon.core.providers.constant.ConstantFactory
                                    object: !!uk.ac.ox.poseidon.core.time.DurationFactory {
                                      days: 10,
                                      hours: 0,
                                      minutes: 0,
                                      seconds: 0
                                    }
                                subject: !!uk.ac.ox.poseidon.core.functions.ValueAsMappingFactory
                                  value: !!uk.ac.ox.poseidon.agents.vessels.values.CurrentTimeAtSeaFactory {
                                    }
                - !!uk.ac.ox.poseidon.agents.tasks.travel.SetDestinationToOriginFactory {
                  }
                - !!uk.ac.ox.poseidon.agents.tasks.travel.TravelAlongPathFactory
                  destination: !!uk.ac.ox.poseidon.agents.vessels.values.CurrentTripDestinationCellFactory {
                    }
                  distance: *id010
                  engine: *id015
                  eventManager: !!uk.ac.ox.poseidon.agents.vessels.values.CurrentTripEventManagerFactory {
                    }
                  pathFinder: *id012
                - !!uk.ac.ox.poseidon.agents.tasks.travel.ArriveInPortFactory {
                  }
                - !!uk.ac.ox.poseidon.agents.tasks.landings.LandCatchesFactory
                  duration: !!uk.ac.ox.poseidon.core.providers.constant.ConstantFactory
                    object: !!uk.ac.ox.poseidon.core.time.DurationFactory {
                      days: 0,
                      hours: 1,
                      minutes: 0,
                      seconds: 0
                    }
                  hold: *id018
                - !!uk.ac.ox.poseidon.agents.tasks.travel.RefuelFactory
                  engine: *id015
                  fuelStationGrid: !!uk.ac.ox.poseidon.agents.fuel.FuelStationGridFactory
                    fuelStations: !!uk.ac.ox.poseidon.agents.fuel.OneFuelStationPerPortFactory
                      eventManager: !!uk.ac.ox.poseidon.core.EventManagerFactory {
                        }
                      portGrid: *id006
                      pricePerLitres: !!uk.ac.ox.poseidon.agents.money.MoneyFactory {
                        amount: 10000.0,
                        currencyUnit: IDR
                      }
                      pumpRateInLitresPerMinute: 200.0
                    portGrid: *id006
                - !!uk.ac.ox.poseidon.agents.tasks.travel.EndTripFactory {
                  }
                - !!uk.ac.ox.poseidon.agents.tasks.general.WaitForFactory
                  duration: !!uk.ac.ox.poseidon.core.providers.constant.ConstantFactory
                    object: !!uk.ac.ox.poseidon.core.time.DurationFactory {
                      days: 0,
                      hours: 12,
                      minutes: 0,
                      seconds: 0
                    }
          components:
          - *id019
          - *id015
          - *id018
          - &id024
            factory: !!uk.ac.ox.poseidon.agents.choices.evaluation.TripEvaluatorFactory
              evaluationProvider: !!uk.ac.ox.poseidon.agents.choices.evaluation.ProfitPerHourDestinationEvaluationProviderFactory {
                currencyCode: IDR
              }
              optionValues: *id013
          eventManager: &id025 !!uk.ac.ox.poseidon.core.EventManagerFactory {
            }
          homePort: *id020
          marketGrid: *id007
          name: &id027 !!uk.ac.ox.poseidon.agents.vessels.PrefixedIdFactory {
            prefix: 'Vessel '
          }
          numberOfVesselsToCreate: 25
          portGrid: *id006
          vesselField: *id021
          vesselIdSupplier: &id028 !!uk.ac.ox.poseidon.core.utils.PrefixedIdSupplierFactory {
            prefix: V
          }
        - !!uk.ac.ox.poseidon.agents.vessels.VesselCreatorFactory
          account: *id022
          behaviour: *id023
          components:
          - *id019
          - *id015
          - *id018
          - *id024
          eventManager: *id025
          homePort: *id026
          marketGrid: *id007
          name: *id027
          numberOfVesselsToCreate: 50
          portGrid: *id006
          vesselField: *id021
          vesselIdSupplier: *id028
startingDateTime: !!uk.ac.ox.poseidon.core.time.DateTimeFactory {
  day: 1,
  hour: 0,
  minute: 0,
  month: 1,
  second: 0,
  year: 1
}
